name: Build AI Gold Trader V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/javad/aigoldtrader

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AI-Gold-Trader"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          mkdir -p app/src/main

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.javad.aigoldtrader'
              compileSdk 35

              defaultConfig {
                  applicationId "com.javad.aigoldtrader"
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="AI Gold Trader"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/javad/aigoldtrader/MainActivity.java <<'EOF'
          package com.javad.aigoldtrader;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              int bg = Color.rgb(11, 15, 22);
              int card = Color.rgb(22, 28, 38);
              int gold = Color.rgb(212, 175, 55);
              int white = Color.WHITE;
              int gray = Color.rgb(175, 185, 198);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(bg);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(28, 32, 28, 40);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  scroll.addView(root);

                  TextView title = text(
                      "AI GOLD TRADER",
                      28,
                      gold,
                      true
                  );
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, fullParams(0, 0, 10, 0));

                  TextView subtitle = text(
                      "XAUUSD  •  GOLD SIGNAL ENGINE",
                      14,
                      gray,
                      false
                  );
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle, fullParams(0, 0, 22, 0));

                  LinearLayout status = createCard();
                  addText(status, "وضعیت سیستم", 16, gray, false);
                  addText(status, "●  OFFLINE", 24, Color.LTGRAY, true);
                  addText(
                      status,
                      "اتصال به منبع داده واقعی هنوز فعال نشده است",
                      14,
                      gray,
                      false
                  );
                  root.addView(status, fullParams(0, 0, 14, 0));

                  LinearLayout signal = createCard();

                  addText(signal, "CURRENT SIGNAL", 13, gray, true);

                  TextView noTrade = addText(
                      signal,
                      "NO TRADE",
                      32,
                      white,
                      true
                  );
                  noTrade.setGravity(Gravity.CENTER);

                  TextView note = addText(
                      signal,
                      "تا زمان دریافت داده واقعی، هیچ سیگنال ساختگی نمایش داده نمی‌شود.",
                      14,
                      gray,
                      false
                  );
                  note.setGravity(Gravity.CENTER);

                  root.addView(signal, fullParams(0, 0, 14, 0));

                  LinearLayout score = createCard();
                  addText(score, "SIGNAL SCORE", 13, gray, true);
                  addText(score, "-- / 100", 30, gold, true);
                  root.addView(score, fullParams(0, 0, 14, 0));

                  LinearLayout levels = createCard();
                  addText(levels, "TRADE LEVELS", 15, gold, true);

                  addRow(levels, "Entry", "--");
                  addRow(levels, "Stop Loss", "--");
                  addRow(levels, "Take Profit 1", "--");
                  addRow(levels, "Take Profit 2", "--");
                  addRow(levels, "Risk / Reward", "--");

                  root.addView(levels, fullParams(0, 0, 14, 0));

                  LinearLayout timeframes = createCard();
                  addText(timeframes, "MULTI TIMEFRAME ANALYSIS", 15, gold, true);

                  addRow(timeframes, "M15", "WAITING");
                  addRow(timeframes, "H1", "WAITING");
                  addRow(timeframes, "H4", "WAITING");

                  root.addView(timeframes, fullParams(0, 0, 14, 0));

                  LinearLayout technical = createCard();
                  addText(technical, "TECHNICAL ENGINE", 15, gold, true);

                  addRow(technical, "EMA 20 / 50 / 200", "WAITING");
                  addRow(technical, "RSI", "WAITING");
                  addRow(technical, "ATR", "WAITING");
                  addRow(technical, "Market Structure", "WAITING");
                  addRow(technical, "BOS / CHoCH", "WAITING");
                  addRow(technical, "Liquidity", "WAITING");
                  addRow(technical, "Support / Resistance", "WAITING");

                  root.addView(technical, fullParams(0, 0, 14, 0));

                  LinearLayout risk = createCard();
                  addText(risk, "RISK MANAGEMENT", 15, gold, true);

                  addRow(risk, "Account", "$100");
                  addRow(risk, "Risk / Trade", "0.5%");
                  addRow(risk, "Max Daily Loss", "2%");
                  addRow(risk, "Martingale", "DISABLED");
                  addRow(risk, "Mandatory SL", "ON");

                  root.addView(risk, fullParams(0, 0, 20, 0));

                  TextView footer = text(
                      "AI GOLD TRADER V2\nManual MT5 Execution • Auto Trading Disabled",
                      12,
                      gray,
                      false
                  );
                  footer.setGravity(Gravity.CENTER);
                  root.addView(footer, fullParams(0, 0, 10, 0));

                  setContentView(scroll);
              }

              LinearLayout createCard() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(22, 20, 22, 20);
                  box.setBackground(roundBackground(card, 18));
                  return box;
              }

              TextView addText(
                  LinearLayout parent,
                  String value,
                  float size,
                  int color,
                  boolean bold
              ) {
                  TextView tv = text(value, size, color, bold);
                  parent.addView(tv, fullParams(0, 0, 8, 0));
                  return tv;
              }

              void addRow(
                  LinearLayout parent,
                  String left,
                  String right
              ) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(0, 8, 0, 8);

                  TextView a = text(left, 14, gray, false);
                  TextView b = text(right, 14, white, true);

                  row.addView(
                      a,
                      new LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1
                      )
                  );

                  row.addView(
                      b,
                      new LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1
                      )
                  );

                  parent.addView(
                      row,
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  );
              }

              TextView text(
                  String value,
                  float size,
                  int color,
                  boolean bold
              ) {
                  TextView tv = new TextView(this);
                  tv.setText(value);
                  tv.setTextSize(size);
                  tv.setTextColor(color);
                  tv.setGravity(Gravity.CENTER_VERTICAL);

                  if (bold) {
                      tv.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  }

                  return tv;
              }

              LinearLayout.LayoutParams fullParams(
                  int top,
                  int right,
                  int bottom,
                  int left
              ) {
                  LinearLayout.LayoutParams p =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      );

                  p.setMargins(left, top, right, bottom);
                  return p;
              }

              GradientDrawable roundBackground(
                  int color,
                  float radius
              ) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(radius);
                  return g;
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          ls -lah app/build/outputs/apk/debug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Gold-Trader-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
