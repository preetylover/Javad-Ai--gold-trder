                  addRow(timeframeCard, "M15", "WAITING");
                  addRow(timeframeCard, "H1", "WAITING");
                  addRow(timeframeCard, "H4", "WAITING");

                  root.addView(timeframeCard, params(1, 0, 0, 0, 0, 14));

                  LinearLayout indicatorsCard = card();

                  TextView indTitle = text(
                      "TECHNICAL ENGINE",
                      15,
                      gold,
                      true
                  );

                  indicatorsCard.addView(indTitle);

                  addRow(indicatorsCard, "EMA 20 / 50 / 200
